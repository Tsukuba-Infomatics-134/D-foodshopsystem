<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>整理券番号表示</title>
<style>
  html, body {
    margin:0;
    height:100%;
    font-family:sans-serif;
    overflow:hidden;
  }

  #bg {
    position:fixed;
    top:0; left:0;
    width:100%; height:100%;
    background-size:cover;
    background-position:center;
    z-index:-1;
    opacity:1;
    transition: opacity 2s ease-in-out;
  }

  .area {
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    position:relative;
  }

#area1 {
  margin-left: 75px;   /* 左からの位置 */
  margin-top: 20px;    /* 上からの位置 */
}

#area2 {
  margin-left: 300px;
  margin-top: 20px;
}

#area3 {
  margin-left: 275px;
  margin-top: 20px;
}


  body {
    display:flex;
    height:100vh;
  }

  .tickets {
    display:grid;
    grid-template-columns:repeat(4, 70px);
    grid-template-rows:repeat(5, 50px);
    gap:35px;
    opacity:1;
    transition: opacity 2.0s;
    margin-bottom:20px;
    margin-top:50px;
  }

  .ticket {
    width:90px;
    height:60px;
    border:2px solid black;
    text-align:center;
    line-height:60px;
    font-size:28px;
    background:white;
    font-weight:bold;
    border-radius:5px;
  }

.single-number {
    transition: opacity 2s ease-in-out;
}

#single1 {
  position:absolute;
  bottom:3%;
  left:80%;
  font-size:68px;
  font-weight:bold;
  transform:none;
}

#single2 {
  position:absolute;
  bottom:3%;
  left:77%;
  font-size:68px;
  font-weight:bold;
  transform:translateX(-50%);
}

#single3 {
  position:absolute;
  bottom:3%;
  left:60%;
  font-size:68px;
  font-weight:bold;
  transform:none;
}

#error {
  margin: 15%;
  text-align: center;
  font-size: 6rem;
  color: red;
}

</style>
</head>
<body>
  <div id="login">
    <p>パスワードを入力してください。</p>
    <input type="password" id="pass" placeholder="パスワードを入力" />
    <button onclick="login()">ログイン</button>
  </div>
  <div id="error" style="display: none;">エラーが発生しました。担当者に連絡してください。</div>
  <div id="main" style="display: none;">
    <div id="bg"></div>

    <div class="area" id="area1">
      <div class="tickets" id="tickets1"></div>
      <div class="single-number" id="single1"></div>
    </div>
    <div class="area" id="area2">
      <div class="tickets" id="tickets2"></div>
      <div class="single-number" id="single2"></div>
    </div>
    <div class="area" id="area3">
      <div class="tickets" id="tickets3"></div>
      <div class="single-number" id="single3"></div>
    </div>
  </div>
<script>
const apiurl_production = "https://api.yaakiyu.f5.si/";
const apiurl_dev = "http://localhost:80/";
let apiurl = apiurl_production;
let auth_key = null;
let isLogin = false;
const allClassData = [{}, {}, {}, {}, {}, {}];


// devサーバーが生きていればapiurlをdevに切り替える
function tryDevApiUrlSwitch() {
  fetch(apiurl_dev + "version", { method: "GET", cache: "no-store" })
    .then(res => {
      if (res.ok) {
        apiurl = apiurl_dev;
        console.warn("apiurlを開発環境に切り替えました");
      }
    })
    .catch(() => {
      // devサーバーが落ちている場合は何もしない
    });
}
tryDevApiUrlSwitch();


function updateAllArea(){
  for (let i = 1; i < 4; i++) {
    const classNumber = 3 * bgIndex + i;
    const ticketsContainer = document.getElementById(`tickets${i}`);
    const singleContainer = document.getElementById(`single${i}`);

    ticketsContainer.innerHTML = '';
    const nums = Object.entries(allClassData[classNumber - 1]).filter((st) => st[1] === "呼び出し中");
    nums.forEach((num) => {
      const div = document.createElement('div');
      div.className = 'ticket';
      div.textContent = num[0];
      ticketsContainer.appendChild(div);
    });

    const waiting = Object.values(allClassData[classNumber - 1]).filter((st) => st === "呼び出し待ち").length;
    singleContainer.textContent = waiting.toString();

    if (classNumber === 6) {
      // 6組はどんな状況でも表示しない
      singleContainer.textContent = "";
      ticketsContainer.innerHTML = '';
    }
  }
}

// 背景画像リスト
const bgImages = ["bg1.png","bg2.png"];
let bgIndex = 0;
const bgDiv = document.getElementById("bg");

function switchBackground(){
  bgIndex = (bgIndex + 1) % bgImages.length;
  bgDiv.style.backgroundImage = `url('${bgImages[bgIndex]}')`;
}


function displayError() {
  document.getElementById("error").style.display = "block";
  document.getElementById("main").style.display = "none";
}
function returnNormal() {
  document.getElementById("error").style.display = "none";
  document.getElementById("main").style.display = "flex";
}


function check() {
  return fetch(apiurl + "check", {
    method: "GET",
    headers: {
      "Content-Type": "application/json",
      authorization: auth_key,
    },
  }).then(async (response) => {
    if (response.status === 200) {
      returnNormal();
      return await response.json();
    } else if (response.status === 429) {
      return null; // レート制限エラーは無視
    } else {
      displayError();
      console.error("Error:", await response.text());
      return null;
    }
  }).catch((error) => {
    console.error("Error:", error);
    displayError();
    return null;
  });
}


function login() {
  const password = document.getElementById("pass").value;
  fetch(apiurl + "login", {
    method: "GET",
    headers: {
      "Content-Type": "application/json",
      password: password,
    },
  }).then(async (response) => {
    const data = await response.json();
    if (response.status === 401) {
      alert("パスワードが違います");
      return;
    } else if (!response.ok) {
      alert("ログイン中にエラーが発生しました。");
      console.error(data);
      return;
    } else if (data["user"] <= 6 || data["type"] !== "d") {
      alert("このユーザーには対応していません。");
      return;
    }
    console.log(data);
    isLogin = true;
    auth_key = data["token"];
    document.getElementById("login").style.display = "none";
    document.getElementById("main").style.display = "flex";
    document.getElementById("pass").value = "";

    const checkInterval = () => {
      if (!isLogin) return;
      check().then(async (ret) => {
        if (ret != null && ret.length > 0) {
          //ここに更新時の挙動を書く
          ret.forEach((item) => {
           if (item["user"] < 1 || item["user"] > 6) return;
            allClassData[item["user"]-1][item["order_id"]] = item["status"]
          });
          updateAllArea();
        }
        setTimeout(() => {
          checkInterval();
        }, 2000);
      });
    };

    fetch(apiurl + "log_all", {
      method: "GET",
      headers: {
        "Content-Type": "application/json",
        authorization: auth_key,
      },
    }).then(async (response) => {
      const data = await response.json();
      if (response.status === 429) {
        const after = response.headers.get("Retry-After");
        console.log("Rate limited. Retry after", after, "seconds");
        isLogin = false;
        document.getElementById("pass").value = password;
        setTimeout(login, parseFloat(after) * 1000);
        return;
      }
      if (!response.ok) {
        console.error("Error:", await response.text());
        alert("ログイン中にエラーが発生しました。");
        return;
      }
      console.log(data);
      for (const key in data) {
        const order = data[key];
        if (order["user"] < 1 || order["user"] > 6) continue;
        allClassData[order["user"]-1][order["id"]] = order["status"];
      }
      updateAllArea();
    });

    checkInterval();
    console.log("checkInterval start");

    bgDiv.style.backgroundImage = `url('${bgImages[bgIndex]}')`;

    // 15秒ごとに背景切替
    setInterval(()=>{
      switchBackground();
      updateAllArea();
    }, 15000);
  }).catch((error) => {
    console.error("Error:", error);
    alert("ログイン中にエラーが発生しました。");
  });
}
</script>

</body>
</html>
